<script>
(function(){
  var locales=["en","es"];
  var saved=null;try{saved=localStorage.getItem('preferred-locale');}catch(e){}
  var nav=(navigator.language||'en').slice(0,2).toLowerCase();
  var pick=(saved&&locales.indexOf(saved)>=0)?saved:(locales.indexOf(nav)>=0?nav:'en');
  location.replace(pick+'/');
})();
