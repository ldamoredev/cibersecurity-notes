<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CyberSec Atlas — ldamoredev cybersecurity knowledge base">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#39d353" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Faint terminal grid -->
  <g stroke="#39d353" stroke-opacity="0.06" stroke-width="1">
    <line x1="0"    y1="120" x2="1200" y2="120"/>
    <line x1="0"    y1="240" x2="1200" y2="240"/>
    <line x1="0"    y1="360" x2="1200" y2="360"/>
    <line x1="0"    y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Top-left terminal crumb -->
  <text x="72" y="92"
        font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="20"
        font-weight="500"
        fill="#39d353"
        letter-spacing="0.02em">
    &gt;_ ~/cybersecurity-atlas
  </text>
  <rect x="378" y="74" width="9" height="22" fill="#39d353"/>

  <!-- Shield mark -->
  <g transform="translate(72, 178)">
    <rect width="96" height="96" rx="22" fill="url(#shield)"/>
    <g transform="translate(48, 48)" stroke="#0f1117" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 -28 L21 -20 V8 C21 22 0 32 0 32 C0 32 -21 22 -21 8 V-20 Z" stroke-width="5.5"/>
      <path d="M-9 0 L-3 6 L9 -7" stroke-width="6"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="72" y="376"
        font-family="Inter, -apple-system, sans-serif"
        font-size="92"
        font-weight="800"
        fill="#e6edf3"
        letter-spacing="-0.025em">Cybersecurity</text>
  <text x="72" y="464"
        font-family="Inter, -apple-system, sans-serif"
        font-size="92"
        font-weight="800"
        fill="#39d353"
        letter-spacing="-0.025em">Knowledge Base</text>

  <!-- Tagline -->
  <text x="72" y="518"
        font-family="Inter, -apple-system, sans-serif"
        font-size="26"
        font-weight="500"
        fill="#9da7b2">
    An atomic atlas of notes, playbooks, and tradecraft — by phase, from substrate to specialty.
  </text>

  <!-- Footer: stats pill row -->
  <g transform="translate(72, 560)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20">
    <text x="0"   y="0" fill="#39d353" font-weight="600">ldamoredev/atlas</text>
    <text x="222" y="0" fill="#6b7280">·</text>
    <text x="244" y="0" fill="#c9d1d9" font-weight="500">278 notes</text>
    <text x="388" y="0" fill="#6b7280">·</text>
    <text x="410" y="0" fill="#c9d1d9" font-weight="500">17 branches</text>
    <text x="586" y="0" fill="#6b7280">·</text>
    <text x="608" y="0" fill="#c9d1d9" font-weight="500">5 phases</text>
  </g>

  <!-- Right-side phase numbers (decorative) -->
  <g transform="translate(820, 184)" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" fill="#39d353" fill-opacity="0.14" font-size="180" letter-spacing="-0.04em">
    <text x="0"   y="0">00</text>
    <text x="180" y="0">01</text>
  </g>
  <g transform="translate(820, 384)" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" fill="#39d353" fill-opacity="0.18" font-size="180" letter-spacing="-0.04em">
    <text x="0"   y="0">02</text>
    <text x="180" y="0">03</text>
  </g>
</svg>
